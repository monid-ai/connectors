schema: spec-driven

context: |
  Tech stack: Deno 2 workspace (TypeScript), zod v4, ajv for JSON Schema validation.
  Repo produces two released artifacts: the generic connector engine (engine/) and the
  compiled connector bundle (.output/catalog.json, built by CI).
  Conventions mirror monid-services: top-level deployables, internal libs under shared/*
  with @shared/<name> import aliases, fmt.indentWidth 4.
  Domain: declarative API connector standard (EndpointDef -> EndpointDoc compilation,
  content-addressed fn table, semver-gated engine compatibility).
